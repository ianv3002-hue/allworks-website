    :root{

      --navy-2:#0f1f33;

      --muted:#596772;
      --line:rgba(7,18,31,.12);

    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}

      color:var(--text);
      line-height:1.7;
      background:var(--cream);
      overflow-x:hidden;
    }
    a{text-decoration:none;color:inherit}
    button,input{font:inherit}
    img{max-width:100%;display:block}

    .luxury-shell{
      background:

    header{

      align-items:center;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:0 6px 26px rgba(0,0,0,.28);
      backdrop-filter:blur(14px);
    }
    .logo{
      font-size:1.65rem;
      font-weight:900;
      letter-spacing:2px;
      text-transform:uppercase;
    }
    .logo span{color:var(--gold-light)}
    .header-cta{
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:var(--navy);
      padding:.78rem 1.4rem;
      border-radius:999px;
      font-weight:800;
      font-size:.95rem;
      transition:.25s;
      box-shadow:0 8px 24px rgba(212,175,55,.35);
    }
    .header-cta:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 28px rgba(212,175,55,.45);
    }

    .hero{
      min-height:760px;
      padding:8rem 5% 7rem;
      color:#fff;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;

        url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2400&q=90")
        center/cover no-repeat;
    }
    .hero:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 78% 20%,rgba(212,175,55,.30),transparent 26%),
        radial-gradient(circle at 20% 78%,rgba(212,175,55,.12),transparent 28%),
        linear-gradient(to top,rgba(7,18,31,.35),transparent 50%);
      pointer-events:none;
    }
    .hero:after{
      content:"";
      position:absolute;
      inset:auto -12% -130px;
      height:220px;
      background:var(--cream);
      transform:rotate(-2.8deg);
      transform-origin:center;
    }
    .hero-content{
      position:relative;
      z-index:2;
      max-width:960px;
      animation:heroIn .85s ease both;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:.7rem;
      color:var(--gold-light);
      font-weight:800;
      letter-spacing:2.3px;
      text-transform:uppercase;
      font-size:.78rem;
      margin-bottom:1.15rem;
    }
    .eyebrow:before,.eyebrow:after{
      content:"";
      width:38px;height:1.6px;background:var(--gold);
    }
